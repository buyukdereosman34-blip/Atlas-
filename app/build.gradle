plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atlas.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.atlas.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.all {
            def atlasEnv = [:]
            def atlasEnvFile = new File(System.getProperty("user.home"), ".config/atlas/env")

            if (atlasEnvFile.isFile()) {
                atlasEnvFile.eachLine { line ->
                    def match = line =~ /^\s*export\s+([A-Za-z_][A-Za-z0-9_]*)=(.*)\s*$/
                    if (match.matches()) {
                        def name = match.group(1)
                        def value = match.group(2).trim()

                        if ((value.startsWith("'") && value.endsWith("'")) ||
                            (value.startsWith('"') && value.endsWith('"'))) {
                            value = value.substring(1, value.length() - 1)
                        }

                        atlasEnv[name] = value
                    }
                }
            }

            environment "ATLAS_AI_PROVIDER",
                    System.getProperty(
                            "ATLAS_AI_PROVIDER",
                            System.getenv("ATLAS_AI_PROVIDER") ?: atlasEnv["ATLAS_AI_PROVIDER"] ?: ""
                    )

            environment "ATLAS_AI_GEMINI_MODEL",
                    System.getProperty(
                            "ATLAS_AI_GEMINI_MODEL",
                            System.getenv("ATLAS_AI_GEMINI_MODEL") ?: atlasEnv["ATLAS_AI_GEMINI_MODEL"] ?: ""
                    )

            environment "ATLAS_AI_GEMINI_API_KEY",
                    System.getProperty(
                            "ATLAS_AI_GEMINI_API_KEY",
                            System.getenv("ATLAS_AI_GEMINI_API_KEY") ?: atlasEnv["ATLAS_AI_GEMINI_API_KEY"] ?: ""
                    )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Shizuku
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
